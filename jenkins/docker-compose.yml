# Jenkins controller + 1 agent chạy trên VM #1
#   cp .env.example .env      # điền AGENT_SECRET sau khi tạo node 'docker-agent'
#   docker compose up -d --build
name: jenkins

services:
  controller:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home

  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    restart: unless-stopped
    environment:
      JENKINS_URL: http://controller:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${AGENT_SECRET:-}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    # Cho user jenkins trong container quyền dùng docker socket của host.
    # Lấy GID bằng: stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace nằm trong volume để docker-workflow dùng --volumes-from
      # khi chạy stage trong container (agent { docker { ... } })
      - agent-work:/home/jenkins/agent
    depends_on:
      - controller

volumes:
  jenkins-home:
  agent-work:
